[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "curated-microbiota"
version = "0.1.2"
description = "Versioned, analysis-ready microbiota collections with lazy retrieval"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["platformdirs>=4.3"]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
curated_microbiota = ["release-manifest.json"]

[tool.setuptools.packages.find]
where = ["."]
include = ["curated_microbiota*"]
