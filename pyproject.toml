[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "curated-microbiota"
version = "0.1.0"
description = "Versioned, analysis-ready microbiota collections with lazy retrieval"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["platformdirs>=4.3"]

[project.optional-dependencies]
mllabiome = ["mllabiome>=0.1.0rc126"]
dev = ["pytest>=8.3"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["curated_microbiota*"]
